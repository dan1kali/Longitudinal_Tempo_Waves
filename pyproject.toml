[project]
name = "longitudinal-tempo-waves"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dan1kali", email = "dl74@rice.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "imageio>=2.37.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "micromed-io>=0.4.5",
    "mne>=1.11.0",
    "natsort>=8.4.0",
    "neo>=0.14.4",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "patsy>=1.0.2",
    "pyvista>=0.48.4",
    "scipy>=1.15.3",
    "statsmodels>=0.14.6",
]


[project.scripts]
longitudinal-tempo-waves = "longitudinal_tempo_waves:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]
